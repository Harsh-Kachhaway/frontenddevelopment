<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fgfh.css">
</head>
<body><div class="logo">TIME.COM</div>
    <div class="cont">
        <h1>Your tine is exact!</h1>
        <p>Current time is:</p>
    </div>
       <div class="ticon"><div id="time"></div></div>
       <div id="date"></div>
       <div class="contwo">
        <div class="box">UAT <div class="uta">546</div></div>
        <div class="box">NEW YORK <div class="new"></div></div>
        <div class="box">MUMBAI <div class="mumbai"></div></div>
       </div>
    <script>
        let a;
        let time;
        const options={weekday:"long",year:"numeric",month:"long",day:"numeric"}
        setInterval(() => {
            a = new Date();
            date = a.toLocaleDateString(undefined,options)// + "," + a.getTimezoneOffset()
            time = a.getHours() + ":" + a.getMinutes() +":"+ a.getSeconds()
            document.getElementById("time").innerHTML = time //+ "<br>" +"  on  "+"<br>" +date 
            document.getElementById("date").innerHTML =  date 
            
        }, 1000);
     

    </script>
</body>
</html>
